name: Log Push History

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  log-push:
    # Skip pushes made by github-actions[bot] to avoid infinite loops
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch enough history to read the file but not the entire repo
          fetch-depth: 2

      - name: Append push record to GIT_HISTORY.md
        run: |
          PUSH_DATE=$(date -u '+%Y-%m-%d %H:%M:%S')
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          PUSH_MESSAGE=$(git log -1 --format='%s' "$COMMIT_SHA" | sed 's/|/—/g')

          FILE="docs/GIT_HISTORY.md"

          if [ ! -f "$FILE" ]; then
            echo "GIT_HISTORY.md not found, skipping."
            exit 0
          fi

          # Count existing push rows to determine the push number
          PUSH_NUM=$(grep -cP '^\| \d+' "$FILE" 2>/dev/null || echo "0")
          PUSH_NUM=$((PUSH_NUM + 1))

          # Build the new row
          NEW_ROW="| ${PUSH_NUM} | ${PUSH_DATE} UTC | ${BRANCH} | \`${SHORT_SHA}\` | ${ACTOR} | ${PUSH_MESSAGE} |"

          # Insert the new row before the PUSH_HISTORY_END marker
          sed -i "s|<!-- PUSH_HISTORY_END -->|${NEW_ROW}\n<!-- PUSH_HISTORY_END -->|" "$FILE"

          # Remove the placeholder row if it still exists
          sed -i '/^\| — | — | — | — | — |.*Automated push logging starts/d' "$FILE"

      - name: Commit and push updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/GIT_HISTORY.md
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: log push to main at $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
